name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install mypy
        run: pip install mypy

      - name: Run lint
        run: |
          ruff check .

      - name: Type check
        run: |
          mypy src/ai_ran_kpi_forecasting

      - name: Run tests
        run: |
          pytest -q

      - name: Generate benchmark report bundle
        run: |
          python ai-ran-kpi-forecasting.py forecast \
            --data data/ran_kpi_sample.csv \
            --cell-id CELL_001 \
            --kpi-col prb_dl_util \
            --horizon 24 \
            --output-dir reports/forecast_examples/latest

      - name: Verify report artifacts
        run: |
          test -f reports/forecast_examples/latest/prb_dl_util_forecast.svg
          test -f reports/forecast_examples/latest/prb_dl_util_impact.svg
          test -f reports/forecast_examples/latest/metrics_summary.md

      - name: Generate congestion scenario dashboard
        run: |
          python ai-ran-kpi-forecasting.py scenario-demo \
            --output-dir reports/scenarios/latest/congestion

      - name: Generate backhaul scenario dashboard
        run: |
          python ai-ran-kpi-forecasting.py scenario-demo \
            --scenario-type backhaul \
            --output-dir reports/scenarios/latest/backhaul

      - name: Generate outage scenario dashboard
        run: |
          python ai-ran-kpi-forecasting.py scenario-demo \
            --scenario-type outage \
            --output-dir reports/scenarios/latest/outage

      - name: Generate evidence portal
        run: |
          python ai-ran-kpi-forecasting.py portal \
            --output reports/index.html

      - name: Generate publish page
        run: |
          python ai-ran-kpi-forecasting.py publish \
            --output-dir reports/publish/latest

      - name: Run three-model comparison (Ridge / GBR / MLP)
        run: |
          python scripts/run_model_comparison.py \
            --data data/ran_kpi_sample.csv \
            --output-dir reports/model_comparison

      - name: Verify model-comparison artifacts
        run: |
          test -f reports/model_comparison/ridge_linear/metrics.json
          test -f reports/model_comparison/gradient_boosting/metrics.json
          test -f reports/model_comparison/mlp/metrics.json
          test -f reports/model_comparison/comparison_metrics.csv
          test -f reports/model_comparison/comparison_metrics.md
          test -f reports/model_comparison/comparison_overlay.svg

      - name: Run R1 → forecast → A1 dataflow simulation
        run: |
          python scripts/simulate_r1_dataflow.py \
            --kpm-input data/ran_kpi_sample.csv \
            --cell-id CELL_001 \
            --kpi-col prb_dl_util \
            --threshold-pct 80 \
            --output-dir reports/r1_dataflow_demo

      - name: Verify rApp pattern artifacts
        run: |
          test -f rapp_manifest.yaml
          test -f schemas/kpm_input_v1.json
          test -f schemas/a1_policy_v1.json
          test -f docs/AI_RAN_INTEGRATION.md
          test -f reports/r1_dataflow_demo/a1_policy_candidate.json
          test -f reports/r1_dataflow_demo/forecast.csv
          test -f reports/r1_dataflow_demo/dataflow_summary.md

      - name: Verify scenario artifacts
        run: |
          test -f reports/scenarios/latest/congestion/dashboard/dashboard.html
          test -f reports/scenarios/latest/congestion/dashboard/dashboard_summary.md
          test -f reports/scenarios/latest/congestion/baseline/prb_dl_util_impact.svg
          test -f reports/scenarios/latest/congestion/congestion/prb_dl_util_impact.svg
          test -f reports/scenarios/latest/backhaul/dashboard/dashboard.html
          test -f reports/scenarios/latest/backhaul/dashboard/dashboard_summary.md
          test -f reports/scenarios/latest/backhaul/baseline/prb_dl_util_impact.svg
          test -f reports/scenarios/latest/backhaul/backhaul/prb_dl_util_impact.svg
          test -f reports/scenarios/latest/outage/dashboard/dashboard.html
          test -f reports/scenarios/latest/outage/dashboard/dashboard_summary.md
          test -f reports/scenarios/latest/outage/baseline/prb_dl_util_impact.svg
          test -f reports/scenarios/latest/outage/outage/prb_dl_util_impact.svg
          test -f reports/index.html
          test -f reports/publish/latest/index.html
