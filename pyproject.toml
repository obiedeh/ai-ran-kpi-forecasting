[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ran-kpi-forecasting"
version = "0.1.0"
description = "AI-native telecom forecasting and operational intelligence for AI-RAN and edge infrastructure."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.23.0",
  "pandas>=1.5.0",
]

[project.scripts]
ai-ran-kpi-forecasting = "ai_ran_kpi_forecasting.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501"]
